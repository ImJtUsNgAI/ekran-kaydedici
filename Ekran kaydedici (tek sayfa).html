<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Ekran Kaydedici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            color: white;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .recording-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-3xl w-full space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-bold tracking-tight text-white">Ekran Kaydedici</h1>
            <p class="text-slate-400">Tarayıcı üzerinden hızlı ve güvenli ekran kaydı.</p>
        </div>

        <!-- Preview Area -->
        <div class="glass rounded-3xl overflow-hidden shadow-2xl relative group">
            <video id="preview" autoplay muted class="w-full aspect-video bg-black object-contain"></video>
            
            <!-- Status Indicator -->
            <div id="statusIndicator" class="hidden absolute top-4 left-4 flex items-center gap-2 bg-red-600/80 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                <span class="w-2 h-2 bg-white rounded-full recording-pulse"></span>
                Kayıt Yapılıyor
            </div>

            <!-- Timer -->
            <div id="timer" class="absolute top-4 right-4 font-mono text-xl font-bold bg-black/50 px-3 py-1 rounded-lg hidden">
                00:00:00
            </div>
        </div>

        <!-- Controls -->
        <div class="glass p-6 rounded-2xl flex flex-wrap items-center justify-center gap-4">
            <button id="startBtn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 transition-all px-6 py-3 rounded-xl font-semibold shadow-lg active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                Kaydı Başlat
            </button>

            <button id="stopBtn" disabled class="flex items-center gap-2 bg-red-600 hover:bg-red-500 disabled:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all px-6 py-3 rounded-xl font-semibold shadow-lg active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="10" height="10" x="7" y="7" rx="2"/></svg>
                Kaydı Durdur
            </button>

            <div class="flex items-center gap-3 ml-auto px-4 py-2 border-l border-white/10">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="audioToggle" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600">
                    <span class="text-sm font-medium text-slate-300">Ses Kaydet</span>
                </label>
            </div>
        </div>

        <!-- Help Info -->
        <p class="text-center text-xs text-slate-500">
            * Kaydı durdurduğunuzda video otomatik olarak .webm formatında indirilir.
        </p>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let startTime;
        let timerInterval;

        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioToggle = document.getElementById('audioToggle');
        const statusIndicator = document.getElementById('statusIndicator');
        const timerDisplay = document.getElementById('timer');

        // Zamanlayıcıyı güncelle
        function updateTimer() {
            const now = Date.now();
            const diff = now - startTime;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            timerDisplay.textContent = `${h}:${m}:${s}`;
        }

        startBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: audioToggle.checked
                });

                preview.srcObject = stream;
                recordedChunks = [];

                // MediaRecorder ayarları
                const options = { mimeType: 'video/webm; codecs=vp9' };
                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    // Kaydı bitir ve indir
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `kayit_${new Date().getTime()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    
                    // Temizlik
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);

                    // Arayüzü sıfırla
                    resetUI();
                };

                // Başlat
                mediaRecorder.start();
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
                
                // UI Güncelleme
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusIndicator.classList.remove('hidden');
                timerDisplay.classList.remove('hidden');

                // Kullanıcı tarayıcı üzerinden paylaşımı durdurursa
                stream.getVideoTracks()[0].onended = () => {
                    if (mediaRecorder.state !== 'inactive') stopBtn.click();
                };

            } catch (err) {
                console.error("Hata:", err);
                if(err.name !== 'NotAllowedError') {
                    alert("Ekran kaydı başlatılamadı: " + err.message);
                }
            }
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            preview.srcObject.getTracks().forEach(track => track.stop());
            resetUI();
        };

        function resetUI() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusIndicator.classList.add('hidden');
            timerDisplay.classList.add('hidden');
            clearInterval(timerInterval);
            timerDisplay.textContent = "00:00:00";
        }
    </script>
</body>
</html>
